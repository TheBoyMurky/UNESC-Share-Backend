services:
  frontend:
    build:
      context: ../UNESC-Share-Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "http://localhost:${API_PORT:-8080}/api/v1"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
