spring.application.name=unesc-share

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:unescshare}
spring.datasource.username=${POSTGRES_USER:unescshare}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Multipart apenas para cadastro com .torrent e adicao de Torrent; nunca conteudos academicos.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
spring.servlet.multipart.file-size-threshold=0
# Parse nativo antes de resolver RequestPart JSON, preservando 413 para excesso de tamanho.
spring.servlet.multipart.resolve-lazily=false
unesc-share.torrent.storage-directory=${TORRENT_STORAGE_DIR:./data/torrents}

# Detalhes de erros JDBC podem conter valores de colunas, inclusive dados pessoais.
logging.level.org.hibernate.orm.jdbc.error=OFF

#Server Properties
server.servlet.context-path=/api/v1

# Documentacao OpenAPI/Swagger fica desligada fora do perfil dev.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.swagger-ui.persist-authorization=false

unesc-share.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

unesc-share.security.jwt.secret=${JWT_SECRET:}
unesc-share.security.jwt.issuer=${JWT_ISSUER:unesc-share}
unesc-share.security.jwt.audience=${JWT_AUDIENCE:unesc-share-api}
unesc-share.security.jwt.ttl=${JWT_TTL:15m}
