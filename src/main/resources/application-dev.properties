spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
# Nao registrar valores SQL: podem incluir hashes de senha e dados pessoais.
logging.level.org.hibernate.orm.jdbc.bind=OFF

unesc-share.seed.enabled=${SEED_ENABLED:true}

# Provisionamento opt-in, independente do catalogo academico.
unesc-share.admin-inicial.enabled=${ADMIN_SEED_ENABLED:false}
unesc-share.admin-inicial.nome=${ADMIN_NAME:}
unesc-share.admin-inicial.email=${ADMIN_EMAIL:}
unesc-share.admin-inicial.senha=${ADMIN_PASSWORD:}
